name: Validate and package HAC portable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: HAC-macOS-arm64-portable
            build_args: --bundles app
          - os: macos-15-intel
            artifact: HAC-macOS-x64-portable
            build_args: --bundles app
          - os: windows-latest
            artifact: HAC-Windows-x64-portable
            build_args: --no-bundle
    runs-on: ${{ matrix.os }}
    env:
      HAC_BASE_URL: https://provider.example/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Check packaging configuration
        id: packaging
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          HAC_BASE_URL: ${{ secrets.HAC_BASE_URL }}
        run: |
          if [ -n "$HAC_BASE_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::HAC_BASE_URL secret is required for a release build."
            exit 1
          else
            echo "::notice::HAC_BASE_URL secret is missing; portable packaging skipped."
          fi
      - name: Build portable application
        run: npm run tauri -- build ${{ matrix.build_args }}
        if: steps.packaging.outputs.enabled == 'true'
        env:
          HAC_BASE_URL: ${{ secrets.HAC_BASE_URL }}
      - name: Package Windows executable
        if: steps.packaging.outputs.enabled == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          $exe = 'src-tauri/target/release/hac-codex-manager.exe'
          if (-not (Test-Path $exe)) { throw 'Application executable is missing' }
          Compress-Archive -Path $exe -DestinationPath 'portable/${{ matrix.artifact }}.zip'
      - name: Package macOS application
        if: steps.packaging.outputs.enabled == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p portable
          test -d src-tauri/target/release/bundle/macos/HAC.app
          # Archive before upload-artifact to preserve executable modes and symlinks.
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/release/bundle/macos/HAC.app \
            'portable/${{ matrix.artifact }}.zip'
      - uses: actions/upload-artifact@v4
        if: steps.packaging.outputs.enabled == 'true'
        with:
          name: ${{ matrix.artifact }}
          path: portable/*.zip
          compression-level: 0
          if-no-files-found: error

  release:
    needs: desktop
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: HAC-*-portable
          path: portable
          merge-multiple: true
      - name: Publish portable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            portable/HAC-Windows-x64-portable.zip
            portable/HAC-macOS-arm64-portable.zip
            portable/HAC-macOS-x64-portable.zip
