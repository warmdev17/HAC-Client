name: Validate and package HAC

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      HAC_BASE_URL: https://provider.example/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Check packaging configuration
        id: packaging
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          HAC_BASE_URL: ${{ secrets.HAC_BASE_URL }}
        run: |
          if [ -n "$HAC_BASE_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::HAC_BASE_URL secret is missing; installer packaging skipped."
          fi
      - run: npm run tauri -- build
        if: steps.packaging.outputs.enabled == 'true'
        env:
          HAC_BASE_URL: ${{ secrets.HAC_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: steps.packaging.outputs.enabled == 'true'
        with:
          name: HAC-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
